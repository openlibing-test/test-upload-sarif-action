name: 'openlibing-upload-sarif'
version: 1.1.1
author: 'test-devops'
description: '将任意工具产出的 SARIF 扫描结果上传到 OBS 并生成构建产物 JSON（OIDC 认证，凭证由 huaweicloud-oidc-auth 插件提供）'

inputs:
  sarif_file:
    description: 'SARIF 文件路径或所在目录（目录自动扫描所有 .sarif 文件）'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'SARIF 文件/目录路径'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 SARIF 文件或目录路径'
  category:
    description: '检查结果分类（用户手动传入，不传则为空）'
    required: false
    default: ''
    layout:
      type: 'input'
      label: '结果分类'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  env_type:
    description: '环境类型：prod（正式环境）/ beta（测试环境）。不传则默认 prod'
    required: false
    default: 'prod'
    layout:
      type: 'input'
      label: '环境类型'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''

outputs:
  result:
    description: '上传结果：success 或 failed'

runs:
  using: 'node16'
  main: 'dist/index.js'
