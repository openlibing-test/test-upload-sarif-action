name: 'openlibing-upload-sarif'
version: 1.1.3
author: 'test-devops'
description: '将任意工具产出的 SARIF 扫描结果上传到 OBS 并生成构建产物 JSON（OIDC 认证，SDK 自包含换证，无需 huaweicloud-oidc-auth 插件）'

inputs:
  sarif_file:
    description: 'SARIF 文件路径或所在目录（目录自动扫描所有 .sarif 文件）'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'SARIF 文件/目录路径'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 SARIF 文件或目录路径'
  category:
    description: '检查结果分类（用户手动传入，不传则为空）'
    required: false
    default: ''
    layout:
      type: 'input'
      label: '结果分类'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  source_path:
    description: '源码根目录（可选，逗号分隔多个）。SARIF 缺少 region.snippet（代码上下文）时，按 uri+行号读源码补齐；不传则默认在 ATOMGIT_WORKSPACE 下按文件名查找'
    required: false
    default: ''
    layout:
      type: 'input'
      label: '源码根目录'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  env_type:
    description: '环境类型：prod（正式环境）/ beta（测试环境）。不传则默认 prod'
    required: false
    default: 'prod'
    layout:
      type: 'input'
      label: '环境类型'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''

outputs:
  result:
    description: '上传结果：success 或 failed'

runs:
  using: 'node16'
  main: 'dist/index.js'
