name: 'openlibing-upload-sarif'
version: 1.0.1
author: 'test-devops'
description: '将 CodeQL 扫描结果(SARIF)上传到 OBS 并生成构建产物 JSON'

inputs:
  sarif_file:
    description: 'SARIF 文件路径'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'SARIF 文件路径'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 SARIF 文件路径'
  obs_ak:
    description: 'OBS Access Key ID'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'OBS AK'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 OBS AK'
  obs_sk:
    description: 'OBS Secret Access Key'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'OBS SK'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 OBS SK'
  apig_app_key:
    description: 'APIG 网关 AppKey'
    required: false
    default: ''
    layout:
      type: 'input'
      label: 'APIG AppKey'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  apig_app_secret:
    description: 'APIG 网关 AppSecret'
    required: false
    default: ''
    layout:
      type: 'input'
      label: 'APIG AppSecret'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  apig_app_code:
    description: 'APIG 网关 AppCode'
    required: false
    default: ''
    layout:
      type: 'input'
      label: 'APIG AppCode'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''

outputs:
  result:
    description: '上传结果：success 或 failed'
  download_url:
    description: 'SARIF 文件下载地址'
  build_result_url:
    description: '构建产物 JSON 下载地址'

runs:
  using: 'node16'
  main: 'dist/index.js'
