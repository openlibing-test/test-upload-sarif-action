name: 'openlibing-upload-sarif'
version: 1.0.8
author: 'test-devops'
description: '将 CodeQL 扫描结果(SARIF)上传到 OBS 并生成构建产物 JSON'

inputs:
  sarif_file:
    description: 'SARIF 文件路径'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'SARIF 文件路径'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 SARIF 文件路径'
  obs_ak:
    description: 'OBS Access Key ID'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'OBS AK'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 OBS AK'
  obs_sk:
    description: 'OBS Secret Access Key'
    required: true
    default: ''
    layout:
      type: 'input'
      label: 'OBS SK'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: '请输入 OBS SK'
  apig_app_key:
    description: 'APIG 网关 AppKey（AK）'
    required: false
    default: ''
    layout:
      type: 'input'
      label: 'APIG AppKey'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  apig_app_secret:
    description: 'APIG 网关 AppSecret（SK）'
    required: false
    default: ''
    layout:
      type: 'input'
      label: 'APIG AppSecret'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  category:
    description: '检查结果分类（用户手动传入，不传则为空）'
    required: false
    default: ''
    layout:
      type: 'input'
      label: '结果分类'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''
  env_type:
    description: '环境类型：prod（正式环境）/ beta（测试环境）。不传则默认 prod'
    required: false
    default: 'prod'
    layout:
      type: 'input'
      label: '环境类型'
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ''

outputs:
  result:
    description: '上传结果：success 或 failed'

runs:
  using: 'node16'
  main: 'dist/index.js'
