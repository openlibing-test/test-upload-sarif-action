name: pre-commit

on:
  workflow_dispatch:
  push: # 推送时也执行 pre-commit 检查
    branches:
      - main
  pull_request_target: ## 使用 pull_request_target 确保 PR 流水线始终读取默认分支（main）的最新配置文件
    branches:
      - "*"
  pull_request_comment:
    types: [created]
    comments: ["/pre-commit"]
    branches:
      - "*"

permissions:
  repository: read
  pr: write

stages:
  initiate:
    name: initiate
    jobs:
      pr-label-running:
        name: pr-label-running
        if: ${{ contains('pull_request_target,pull_request_comment,MR,Note', atomgit.event_name) }}
        runs-on: ["self-hosted", "region=cn"]
        steps:
          - name: pr-label-running
            uses: openlibing/pr-label-action@v1.0.0
            with:
              token: ${{ secrets.ROBOT_TOKEN }}
              add_labels: ci-pipeline-running
              remove_labels: ci-pipeline-passed,ci-pipeline-failed

  pre-commit:
    name: pre-commit
    jobs:
      pre-commit:
        name: pre-commit
        runs-on: ["self-hosted", "region=overseas"]
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.event.pull_request.head.sha }} # 使用预合并后的 commit SHA 进行检出，确保 CI 检查的是 PR 与目标分支合并后的最终代码状态
              allow-unsafe-pr-checkout: true # 关闭 fork PR 检出拦截，避免流水线在 fork PR 场景失败

          - name: setup-node
            uses: setup-node
            with:
              node-version: 20
              cache: true

          - name: setup-prettier
            run: |
              npm install --save-dev --save-exact prettier@3.9.5
              echo 'npx version:' && npx -v
              echo 'prettier version:' && npx prettier --version

          - name: setup-go
            uses: setup-go
            with:
              version: 1.26
              cache: true

          - name: pre-commit
            uses: openlibing/pre-commit-action@v1.0.2
            with:
              extra_args: ${{ inputs.extra_args }}

post:
  jobs:
    label-pr:
      name: pr-label-complete
      if: ${{ contains('pull_request_target,pull_request_comment,MR,Note', atomgit.event_name) }}
      runs-on: ["self-hosted", "region=cn"]
      steps:
        - name: set pr label complete
          uses: openlibing/pr-label-action@v1.0.0
          with:
            token: ${{ secrets.ROBOT_TOKEN }}
            add_labels: ${{ pipeline.upstream_status == 'COMPLETED' && 'ci-pipeline-passed' || 'ci-pipeline-failed' }}
            remove_labels: ci-pipeline-running
