name: nightly-schedule-scan

on:
  schedule:
    - cron: '0 0 3 * * ?'
  workflow_dispatch:
  push: # 临时：合入默认分支前在 full-check-update 上验证，通过后删除本段
    branches:
      - full-check-update

permissions:
  repository: read
  id-token: write

stages:
  nightly-scan:
    name: 夜间扫描
    fail_fast: false
    jobs:
      pre-commit:
        name: pre-commit
        runs-on: ['self-hosted', 'region=overseas']
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              token: ${{ secrets.ROBOT_TOKEN }}

          - name: setup-go
            uses: setup-go
            with:
              version: 1.26
              cache: true

          - name: setup-node
            uses: setup-node
            with:
              node-version: 20
              cache: true

          - name: Install npm dependencies
            run: npm install

          - name: setup-prettier
            run: npm install --save-dev --save-exact prettier@3.9.5

          - name: Install SARIF formatter
            run: npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0

          - name: Create report directory
            run: mkdir -p ./tmp_pre-commit-reports/

          - name: run pre-commit
            id: pre-commit
            uses: openlibing/pre-commit-action@v1.0.2
            with:
              extra_args: "--all-files"
              gc_token: ${{ secrets.ROBOT_TOKEN }}
              report-dir: ./tmp_pre-commit-reports/

          - name: upload sarif reports
            if: ${{ always() }}
            uses: openlibing/upload-sarif-action@v1.0.0
            with:
              sarif_file: ${{ steps.pre-commit.outputs.sarif-files }}
              source_path: src
              category: "pre-commit-report"
